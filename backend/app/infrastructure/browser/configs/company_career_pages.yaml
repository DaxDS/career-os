connector_key: company_career_pages
selectors:
  resume_upload: "input[type='file']"
  cover_letter_upload: "input[type='file'][accept*='pdf'], input[type='file']:nth-of-type(2)"
  email_field: "textarea, input[type='email']"
  text_fields:
    name: "input[name*='name'], input[autocomplete='name']"
    email: "input[type='email']"
    phone: "input[type='tel']"
  validation_error: ".error, .field-error, [aria-invalid='true']"
  submit_button: "button[type='submit'], button:has-text('Apply'), button:has-text('Submit')"
captcha:
  iframe_selectors:
    - "iframe[src*='recaptcha']"
    - "iframe[src*='hcaptcha']"
  text_indicators:
    - "captcha"
    - "robot"
