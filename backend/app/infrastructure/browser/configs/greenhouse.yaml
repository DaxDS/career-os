connector_key: greenhouse
# Covers both Greenhouse board generations: legacy boards.greenhouse.io
# (id-based fields like #first_name, #submit_app) and the newer
# job-boards.greenhouse.io React board (name= attributes).
selectors:
  apply_button: "a[href='#app'], button:has-text('Apply'), a:has-text('Apply now')"
  application_form: "#application, #app_body, form#application-form, input#first_name, input[name='first_name']"
  first_name_field: "input#first_name, input[name='first_name']"
  last_name_field: "input#last_name, input[name='last_name']"
  resume_upload: "input#resume, input[type='file'][name*='resume'], input[type='file']"
  cover_letter_upload: "input#cover_letter, input[type='file'][name*='cover']"
  text_fields:
    email: "input#email, input[name='email'], input[type='email']"
    phone: "input#phone, input[name='phone'], input[type='tel']"
  validation_error: ".field-error-msg, [class*='error-message'], [role='alert']"
  submit_button: "input#submit_app, button#submit_app, button[type='submit']"
captcha:
  iframe_selectors:
    - "iframe[src*='recaptcha']"
    - "iframe[src*='hcaptcha']"
  text_indicators:
    - "captcha"
    - "verify you are human"
