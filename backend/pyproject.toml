[project]
name = "career-os"
version = "1.0.0"
description = "Personal AI Career Operating System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "structlog>=24.4.0,<26.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "python-multipart>=0.0.17,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "pypdf>=5.1.0,<7.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "openai>=1.57.0,<2.0.0",
    "anthropic>=0.42.0,<1.0.0",
    "langgraph>=0.2.60,<1.0.0",
    "langchain-core>=0.3.27,<1.0.0",
    "playwright>=1.49.0,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
career-os = "app.cli:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
per-file-ignores = { "tests/**" = ["F401", "F841", "F811"] }
